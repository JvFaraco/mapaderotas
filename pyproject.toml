[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-coverage-map"
version = "1.0.0"
description = "Geospatial route coverage pipeline with progressive geocoding, IBGE boundaries, Voronoi fallback, overlap clipping and privacy-safe standalone maps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["geospatial", "geocoding", "leaflet", "shapely", "openstreetmap", "ibge", "voronoi", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "requests>=2.31,<3",
  "geopy>=2.4,<3",
  "shapely>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pyshp>=2.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<3",
]

[project.scripts]
route-coverage = "route_coverage.cli:main"

[project.urls]
Repository = "https://github.com/JvFaraco/mapaderotas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["route_coverage"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
